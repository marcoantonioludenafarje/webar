<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WebAR Lab / Interaction</title>
    <link rel="stylesheet" href="../../shared/layout.css" />
    <link rel="stylesheet" href="../../shared/ar-overlay.css" />
    <link rel="stylesheet" href="./style.css" />

    <!-- Same two pinned vendor scripts as lab-02/03; see lab-02 for why. -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: ../../../targets/lab-02-image-tracking/card.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets></a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false" raycaster="far: 10000"></a-camera>

      <a-entity light="type: ambient; intensity: 0.75"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-entity id="model-wrapper" position="0 0 0" scale="1 1 1">
          <!-- Rotation as in LAB A3: +90 about X stands a Y-up model on the card. -->
          <a-entity id="character" rotation="90 0 0"></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
